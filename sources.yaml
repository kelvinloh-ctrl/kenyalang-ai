# ============================================================
# Daily brief 输出规则（routine prompt 读这段）
# ============================================================
daily_output:
  format: "4-section markdown"
  sections:
    - bucket: ai
      heading: "## 1. AI 发展"
      top_n_min: 5
      top_n_max: 8
      weight_threshold: 4
      empty_label: "无重大"
    - bucket: my-law
      heading: "## 2. 大马法律修订"
      top_n_min: 0
      top_n_max: 3
      weight_threshold: 3
      empty_label: "今日无重大法律修订"
      highlight_acts: true  # 33 Acts watch list 命中 → 头条加红
    - bucket: fitness
      heading: "## 3. 健身行业"
      top_n_min: 0
      top_n_max: 3
      weight_threshold: 3
      empty_label: "今日无重大健身行业新闻"
    - bucket: stocks
      heading: "## 4. 股市持仓 + IPO"
