# Kenyalang.AI · 来源清单 v2.0
# 编辑规则：增删改任何来源直接改本文件，下次 daily run 自动生效
#
# v2.0 重构（Kelvin 2026-05-04 签）：
# - 顶层从 20 子类合并 → 4 buckets（ai / my-law / fitness / stocks）
# - 砍：x_handles（13）/ forums（14）/ medical_ai（16）/ legal_ai 学术（18）/ education_ai（19）
# - 砍 fitness 子项：学会（ACSM/NSCA/NASM/ACE）/ 竞品（Anytime/Planet/F45 — 另起 Fitcom 内部 watch）
# - 加 my-law bucket：Federal Gazette + Parlimen + AGC + Bernama + 33 Acts watch
# - 加 fitness：Health & Fitness Association（前 IHRSA 后身）+ KKM
# - 加 stocks bucket：Bursa + SC + SEC EDGAR + S&P + 4 IR
#
# 字段说明：
#   name              来源显示名（brief 引用）
#   type              rss / web / github / arxiv
#   url               抓取地址
#   weight            权重 1-5（5 = 必看 · 1 = 弱信号）
#   tags              分类
#   needs_browser_ua  curl 直接 403，需要正经 User-Agent
#
# ⚠️ 核心原则（Kelvin 2026-04-26 + 2026-05-04 定）：真实性 > 数量
# - 优先官方来源 + 严肃分析
# - 砍传谣 / 推测 / 粉丝向 / 媒体二手
# - Brief 每条必须能溯源到原始来源 URL，不允许「有人说」
# - URL fetch != 200 → 该来源本次 brief 不出现，禁止编造

version: 2.0
last_updated: 2026-05-04
owner: kelvin
core_principle: "真实性 > 数量 · 要官方"

