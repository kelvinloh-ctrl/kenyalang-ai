# Kenyalang.AI · 来源清单 v1
# 编辑规则：增删改任何来源直接改本文件，下次 daily run 自动生效
# 字段说明：
#   name        来源显示名（brief 里会引用）
#   type        rss / web / x_handle / github / hn / reddit / arxiv
#   url         抓取地址
#   weight      权重 1-5（5 = 必看，1 = 弱信号）
#   tags        分类，方便筛选
#
# ⚠️ 核心原则（Kelvin 2026-04-26 定）：真实性 > 数量
# - 优先官方来源（labs blog / 公司发布）+ 严肃分析（Stratechery / Latent Space / The Information）
# - 砍掉传谣 / 推测 / 粉丝向论坛
# - 个人 Twitter 谨慎用，只挑能直接发布消息的本人账号
# - Brief 里每条必须能溯源到原始来源，不能只引用「有人说」

